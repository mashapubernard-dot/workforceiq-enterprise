_metadata:
  major_version: 1

display_information:
  name: WorkforceIQ AI
  description: AI workforce assistant for WorkforceIQ Enterprise
  background_color: "#0f172a"

features:
  bot_user:
    display_name: WorkforceIQ AI
    always_online: true
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: true
    messages_tab_read_only_enabled: true

oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - im:history
      - views:write

settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: true
